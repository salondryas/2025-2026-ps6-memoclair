<button
  type="button"
  class="choice-card"
  [class.correct]="isCorrect"
  [class.success]="isCorrect"
  [class.wrong]="isWrong"
  [class.auto-highlight]="isAutoHighlighted"
  [class.reading]="isReading"
  [class.no-image]="imageLoadFailed"
  [attr.aria-describedby]="describedBy"
  [disabled]="isDisabled"
  (click)="onCardClick()"
>
  <img 
    *ngIf="!imageLoadFailed"
    [src]="choice.image" 
    [alt]="choice.label" 
    class="choice-image"
    (error)="onImageError()"
  />
  <span *ngIf="imageLoadFailed" class="image-placeholder">🖼️</span>
  <span class="choice-label">{{ choice.label }}</span>
  <span class="check" *ngIf="isCorrect">✓</span>
  
  <!-- Confettis pour les réussites -->
  <div class="confetti-container" *ngIf="isCorrect">
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
  </div>
  
  <!-- Particules lumineuses -->
  <div class="sparkle" *ngIf="isCorrect"></div>
  <div class="sparkle" *ngIf="isCorrect"></div>
  <div class="sparkle" *ngIf="isCorrect"></div>
  <div class="sparkle" *ngIf="isCorrect"></div>
  <div class="sparkle" *ngIf="isCorrect"></div>
</button>
